name: Feature request
description: Suggest a focused improvement to Glance.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Glance is intentionally small and Mac-native. Explain the problem first so the proposed change can be evaluated in that context.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today, and who does it affect?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like Glance to provide.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you tried?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related links if they clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
