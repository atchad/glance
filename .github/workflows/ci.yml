name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate scripts
        run: |
          zsh -n scripts/*.sh
          plutil -lint support/Info.plist
          test "$(plutil -extract SUFeedURL raw support/Info.plist)" = \
            'https://github.com/atchad/glance/releases/latest/download/appcast.xml'
          test -n "$(plutil -extract SUPublicEDKey raw support/Info.plist)"
          test "$(plutil -extract SURequireSignedFeed raw support/Info.plist)" = true

      - name: Identify build toolchain
        id: toolchain
        run: |
          toolchain_key="$( { swift --version; xcodebuild -version; xcrun --show-sdk-path; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Swift builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**', 'scripts/**', 'support/**') }}
          restore-keys: |
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Run tests
        run: zsh scripts/test.sh

      - name: Build universal application
        run: ./scripts/build-app.sh release

      - name: Verify application
        run: |
          zsh scripts/verify-app-signing.sh dist/Glance.app
          lipo dist/Glance.app/Contents/MacOS/Glance -verify_arch arm64 x86_64
          test -d dist/Glance.app/Contents/Frameworks/Sparkle.framework
          test -f dist/Glance.app/Contents/Resources/Sparkle-LICENSE.txt
          otool -L dist/Glance.app/Contents/MacOS/Glance \
            | grep -q '@rpath/Sparkle.framework/Versions/B/Sparkle'
          otool -l dist/Glance.app/Contents/MacOS/Glance \
            | grep -q '@executable_path/../Frameworks'
