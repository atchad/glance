name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate scripts
        run: zsh -n scripts/*.sh

      - name: Run tests
        run: swift test

      - name: Build universal application
        run: ./scripts/build-app.sh release

      - name: Verify application
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Glance.app
          lipo dist/Glance.app/Contents/MacOS/Glance -verify_arch arm64 x86_64
